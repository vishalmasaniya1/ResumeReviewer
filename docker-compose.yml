version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: resumereviewer_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: resumereviewer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: resumereviewer_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@recruiter.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8080:80"
    depends_on:
      - db

  ollama:
    image: ollama/ollama:latest
    container_name: resumereviewer_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
